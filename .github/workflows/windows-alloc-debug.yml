# TEMPORARY: find which command of the java pulse test hangs on Windows.

name: windows-alloc-debug

on:
  push:
    branches:
      - windows-alloc-debug

jobs:
  debug:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Windows dependencies
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          pacman -S --needed --noconfirm autoconf-wrapper automake-wrapper make
          github_path="$(cygpath -u "$GITHUB_PATH")"
          echo 'C:\msys64\mingw64\bin' >> "$github_path"
          echo 'C:\msys64\usr\bin' >> "$github_path"

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Use OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.4.1+options
          windows-compiler: mingw
          windows-environment: msys2

      - run: ./build-infer.sh --yes --user-opam-switch java

      - name: Which command of the java pulse test hangs?
        run: |
          set +e
          ROOT="$PWD"
          INFER="$ROOT/infer/bin/infer.exe"
          cd infer/tests/codetoanalyze/java/pulse

          # Run a command with a watchdog: if it is still alive after $2 seconds, print what the
          # whole process tree is doing (this is the only way to see which command is stuck: the
          # test redirects everything to files) and only then kill it.
          RC=""
          watch_run () {
            tag="$1" ; secs="$2" ; shift 2
            echo "======== BEGIN $tag: $*"
            "$@" > "/tmp/$tag.log" 2>&1 &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt "$secs" ]; do
              sleep 5
              waited=$((waited + 5))
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "-------- $tag IS STILL RUNNING after ${secs}s"
              echo "-------- processes"
              powershell -NoProfile -Command 'Get-CimInstance Win32_Process | Where-Object { $_.Name -match "infer|java|git|make|sh|bash|grep|diff|sed" } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List'
              echo "-------- infer log, tail"
              tail -30 infer-out/logs 2>/dev/null
              echo "-------- _build_logs, tail"
              for f in "$ROOT"/_build_logs/*; do
                echo "---- $f"
                tail -20 "$f"
              done
              kill -9 "$pid" 2>/dev/null
              taskkill //F //T //IM infer.exe 2>/dev/null
              taskkill //F //T //IM java.exe 2>/dev/null
              taskkill //F //T //IM javac.exe 2>/dev/null
              RC="TIMEOUT"
            else
              wait "$pid"
              RC="$?"
            fi
            echo "-------- $tag rc=$RC, output tail:"
            tail -40 "/tmp/$tag.log"
            echo "======== END $tag"
          }

          CP="$(make --no-print-directory print-CLASSPATH | sed 's/^CLASSPATH=//')"
          read -r -a OPTS <<< "$(make --no-print-directory print-INFER_OPTIONS | sed 's/^INFER_OPTIONS=//')"
          JAVAC="$(make --no-print-directory print-JAVAC | sed 's/^JAVAC=//')"
          echo "======== JAVAC=$JAVAC"
          echo "======== INFER_OPTIONS=${OPTS[*]}"

          rm -rf infer-out issues.exp.test

          # 1. the capture and analysis the test really runs, with the test's own flags
          watch_run capture 420 "$INFER" --project-root ../../.. --dump-duplicate-symbols \
            -o infer-out "${OPTS[@]}" -- \
            $JAVAC -g --release 21 -cp "$CP" *.java taint/*.java
          capture_rc="$RC"

          # 2. the report that turns it into issues.exp.test
          if [ "$capture_rc" != TIMEOUT ]; then
            watch_run report 180 "$INFER" report -q --results-dir infer-out --issues-tests \
              issues.exp.test
            echo "-------- issues.exp.test: $(wc -l < issues.exp.test 2>/dev/null) lines"
          fi

          # 3. the comparison with the expected output, as check_no_diff runs it
          watch_run diff 120 bash -c 'cd ../../.. && git --no-pager diff --color=auto --no-ext-diff \
            --no-index --word-diff --unified=1 --minimal \
            $(realpath codetoanalyze/java/pulse/issues.exp) \
            $(realpath codetoanalyze/java/pulse/issues.exp.test)'

          # 4. and finally the whole thing, from scratch, as CI runs it
          rm -rf infer-out issues.exp.test
          watch_run maketest 600 make --trace test
