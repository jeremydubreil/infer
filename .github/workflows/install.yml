name: build

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
  pull_request: {}

env:
  USER_LLVM: "no"
  KOTLINC: "no"

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      upload-url: ${{ steps.create-release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create-release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Infer version ${{ github.ref }}
          draft: true
          prerelease: false
          body: |
            BEFORE PUBLISHING CHECKLIST:
            1. From the commit tagged on GitHub, create and push a new version of the website with "make new-website-version" (see website/README.md for how to test).
            2. Consider deleting the oldest documentation version (see Docusaurus 2 documentation for details).
            3. Fill in the changelog below to go on GitHub.
            4. Download the release tarballs and test that the binaries works.
            5. Fill in the shasums by running the command at the end of the release text.
            --- PUBLISH GITHUB RELEASE HERE ---
            6. At some point, copy the GitHub changelog to Changelog.md in the repo.
            7. Tweet.
            --- DELETE EVERYTHING ABOVE THIS LINE ---

            This is a binary release of Infer for Linux and MacOS. To use it follow these [instructions](http://fbinfer.com/docs/getting-started).

            - new feature 1
            - new feature 2

            The sha256 checksums of the tarballs are:
            ```
            $ shasum -a 256 infer-*-v<VERSION GOES HERE>.tar.xz
            DOWNLOAD BOTH TARBALLS AND PUT RESULT OF THE ABOVE COMMAND HERE BEFORE PUBLISHING
            ```

  build:
    name: Build Infer
    needs: create-release

    strategy:
      fail-fast: false
      matrix:
        os:
          - macOS-latest
          - ubuntu-24.04
          - windows-2025
        ocaml-compiler:
          - ocaml-variants.5.4.1+options,ocaml-option-flambda
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # The build is bash- and GNU make-driven on every platform. On Windows this resolves to the
        # MSYS2 bash that the Windows packages step below puts first on the PATH (see devsetup.yml).
        shell: bash

    steps:
      # The tests rely on symlinks checked into the repository, e.g. infer/tests/.inferconfig, which
      # Git for Windows checks out as plain text files unless told otherwise.
      - name: Check out symlinks as symlinks on Windows
        if: runner.os == 'Windows'
        run: git config --system core.symlinks true

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Required Packages for Windows
        if: runner.os == 'Windows'
        # MSYS2 is preinstalled on the runner image but kept off PATH; see devsetup.yml for details.
        shell: C:\msys64\usr\bin\bash.exe --noprofile --norc -eo pipefail {0}
        run: |
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          pacman -S --needed --noconfirm autoconf-wrapper automake-wrapper make
          github_path="$(cygpath -u "$GITHUB_PATH")"
          echo 'C:\msys64\mingw64\bin' >> "$github_path"
          echo 'C:\msys64\usr\bin' >> "$github_path"
          # the expected test outputs use the Unicode symbols infer prints in a UTF-8 locale, which
          # the Linux and macOS runners set and the Windows one does not
          echo 'LANG=C.UTF-8' >> "$(cygpath -u "$GITHUB_ENV")"

      - name: Install Required Apt Packages for Ubuntu
        if: runner.os == 'Linux'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository -y "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y clang-21 llvm-21 llvm-21-dev libmpfr-dev libsqlite3-dev ninja-build
          sudo apt-get clean
          echo "USER_LLVM=yes" >> $GITHUB_ENV
          echo "LLVM_CONFIG=/usr/lib/llvm-21/bin/llvm-config" >> $GITHUB_ENV

      - name: Install Required Brew Packages for MacOS
        if: runner.os == 'macOS'
        run: |
          brew install automake jq ninja pkg-config lzlib zlib coreutils llvm@21
          echo "USER_LLVM=yes" >> $GITHUB_ENV
          echo "LLVM_CONFIG=$(brew --prefix llvm@21)/bin/llvm-config" >> $GITHUB_ENV

      - name: Setup Java SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Get OS version
        uses: sersoft-gmbh/os-version-action@v1
        id: os-version

      - name: Force the use of test dependencies
        run: cp opam/infer-tests.opam.locked opam/infer.opam.locked

      - name: Use OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          # ignored on non-Windows runners; see devsetup.yml
          windows-compiler: mingw
          windows-environment: msys2

      # Only the Java analyzers are built on Windows for now: the clang ones need infer's own clang,
      # which facebook-clang-plugins/clang/setup.sh only knows how to build on Linux and macOS.
      - name: Compute hash of clang installation
        if: runner.os != 'Windows'
        id: clang-hash
        run: |
          echo "value=$(./facebook-clang-plugins/clang/setup.sh --clang-hash)" >> $GITHUB_OUTPUT

      - name: Attempt to get clang from the cache
        if: runner.os != 'Windows'
        id: cache-clang-restore
        uses: actions/cache/restore@v4
        with:
          path: facebook-clang-plugins/clang/install
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ steps.clang-hash.outputs.value }}

      - name: Record that the clang cache was hit
        if: steps.cache-clang-restore.outputs.cache-hit == 'true'
        run: ./facebook-clang-plugins/clang/setup.sh --only-record-install

      - name: Build clang on cache misses
        if: runner.os != 'Windows' && steps.cache-clang-restore.outputs.cache-hit != 'true'
        run: |
          ./facebook-clang-plugins/clang/src/prepare_clang_src.sh
          CC=clang CXX=clang++ ./facebook-clang-plugins/clang/setup.sh --ninja --sequential-link

      - name: Validate rebuilt clang installation
        if: runner.os != 'Windows' && steps.cache-clang-restore.outputs.cache-hit != 'true'
        run: |
          ./facebook-clang-plugins/clang/setup.sh --only-check-install
          ./facebook-clang-plugins/clang/install/bin/clang --version
          ./facebook-clang-plugins/clang/install/bin/clang++ --version
          ./facebook-clang-plugins/clang/install/bin/llvm-config --version

      - name: Save rebuilt clang to the cache
        if: runner.os != 'Windows' && steps.cache-clang-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: facebook-clang-plugins/clang/install
          key: clang-${{ runner.os }}-${{ runner.arch }}-${{ steps.clang-hash.outputs.value }}

      - if: runner.os == 'Linux'
        run: ./build-infer.sh --yes --user-opam-switch

      - if: runner.os == 'macOS'
        run: ./build-infer.sh --yes --user-opam-switch -- --disable-python-analyzers --disable-swift-analyzers

      - if: runner.os == 'Windows'
        run: ./build-infer.sh --yes --user-opam-switch java

      - name: Install ocamlformat
        run: |
          opam install --deps-only --locked opam/ocamlformat.opam.locked
          opam install ocamlformat.$(grep -e '^version:' ./opam/ocamlformat.opam.locked | cut -d ' ' -f 2 | tr -d \")
          opam exec -- ocamlformat --version

      - name: Test infer
        if: runner.os != 'Windows'
        run: make test -k NDKBUILD=no

      # `make test` requires all the analyzers, and only the Java ones are built on Windows
      - name: Test infer
        if: runner.os == 'Windows'
        run: make config_tests NDKBUILD=no

      - if: runner.os != 'Windows'
        run: |
          sudo make install BUILD_MODE=opt
          # restore permissions after root build
          sudo chown -R $USER: .

      - if: runner.os == 'Windows'
        run: make install BUILD_MODE=opt

      - name: Build release tarball
        id: build-release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/create_binary_release.sh "$(echo '${{ github.ref }}' | rev | cut -d / -f 1 | rev)"

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload-url }}
          asset_path: ${{ steps.build-release.outputs.tarball-path }}
          asset_name: ${{ steps.build-release.outputs.tarball-path }}
          asset_content_type: application/x-gtar
